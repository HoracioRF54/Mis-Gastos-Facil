<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10b981" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="8" />

  <!-- Outer subtle glow circle -->
  <circle cx="256" cy="256" r="180" fill="#10b981" opacity="0.08" filter="blur(20px)" />

  <!-- Wallet Body -->
  <g filter="url(#glow)">
    <!-- Main wallet back -->
    <rect x="96" y="150" width="320" height="230" rx="36" fill="url(#emeraldGrad)" />
    
    <!-- Top inner fold -->
    <path d="M 96 210 L 416 210" stroke="#047857" stroke-width="4" opacity="0.4" />
    
    <!-- Wallet flap/latch -->
    <path d="M 270 215 L 396 215 C 418 215 428 230 428 265 C 428 300 418 315 396 315 L 270 315 Z" fill="#047857" />
    
    <!-- Wallet clasp / coin button -->
    <circle cx="380" cy="265" r="18" fill="url(#coinGrad)" stroke="#fef3c7" stroke-width="3" />
    <circle cx="380" cy="265" r="7" fill="#78350f" opacity="0.3" />

    <!-- Dollar / Currency Symbol on wallet center-left -->
    <text x="195" y="292" font-family="system-ui, -apple-system, sans-serif" font-size="76" font-weight="900" fill="#ffffff" text-anchor="middle" opacity="0.95">$</text>
  </g>

  <!-- Rising coin / Daily badge on top -->
  <g transform="translate(0, -20)">
    <circle cx="256" cy="130" r="44" fill="url(#coinGrad)" stroke="#fef3c7" stroke-width="4" filter="url(#glow)" />
    <text x="256" y="146" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#78350f" text-anchor="middle">$</text>
  </g>

  <!-- Small sparkles -->
  <path d="M 140 120 Q 145 135 160 140 Q 145 145 140 160 Q 135 145 120 140 Q 135 135 140 120 Z" fill="#34d399" opacity="0.8" />
  <path d="M 370 110 Q 374 122 386 126 Q 374 130 370 142 Q 366 130 354 126 Q 366 122 370 110 Z" fill="#fbbf24" opacity="0.85" />
</svg>
